<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dawson OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --wall-a:#07202A; --wall-b:#124A59; --wall-c:#1FA2B8;
  --shell:#F1F6F5; --shell-2:#E2ECEA; --shell-3:#D3E0DE;
  --ink:#10262C; --muted:#5C757B;
  --line:rgba(12,44,54,.16);
  --accent:#1FA2B8; --accent-2:#7BD8E6; --accent-ink:#04212A;
  --mango:#FF9A3C; --rose:#F2617A; --moss:#57B894;
  --chrome:rgba(255,255,255,.72);
  --glass:rgba(8,32,40,.5);
  --glass-line:rgba(255,255,255,.18);
  --shadow:0 30px 70px -14px rgba(2,14,20,.65),0 2px 10px rgba(2,14,20,.25);
  --shadow-sm:0 10px 26px -8px rgba(2,14,20,.5);
  --r-win:18px; --r-sm:10px;
  --ff-disp:"Bricolage Grotesque",Georgia,serif;
  --ff-ui:"Figtree","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --shell:#13262C; --shell-2:#0E1E23; --shell-3:#0A171B;
    --ink:#E4F1F0; --muted:#8CA6AC;
    --line:rgba(255,255,255,.12);
    --chrome:rgba(20,44,52,.82);
  }
}
:root[data-theme="dark"]{
  --shell:#13262C; --shell-2:#0E1E23; --shell-3:#0A171B;
  --ink:#E4F1F0; --muted:#8CA6AC;
  --line:rgba(255,255,255,.12);
  --chrome:rgba(20,44,52,.82);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--ff-ui);
  color:var(--ink);
  background:var(--wall-a);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---------- screen + wallpaper ---------- */
#screen{position:relative;height:100%;overflow:hidden;isolation:isolate}
#wall{position:absolute;inset:0;z-index:0;transition:opacity .4s ease}
#wall.w1{background:
  radial-gradient(120% 90% at 18% 8%, #2BC2D6 0%, rgba(43,194,214,0) 55%),
  radial-gradient(100% 80% at 88% 92%, #0E6E7F 0%, rgba(14,110,127,0) 60%),
  linear-gradient(160deg,var(--wall-b),var(--wall-a) 70%);}
#wall.w2{background:
  radial-gradient(90% 70% at 80% 12%, #FF9A3C 0%, rgba(255,154,60,0) 55%),
  radial-gradient(110% 90% at 10% 90%, #7A3D8F 0%, rgba(122,61,143,0) 60%),
  linear-gradient(165deg,#2A1B3D,#0B1220 75%);}
#wall.w3{background:
  radial-gradient(100% 80% at 50% 0%, #57B894 0%, rgba(87,184,148,0) 60%),
  linear-gradient(180deg,#0B2F2A,#061417 80%);}
#wall.w4{background:
  radial-gradient(100% 75% at 85% 15%, #FFC46B 0%, rgba(255,196,107,0) 55%),
  radial-gradient(90% 70% at 8% 85%, #F2617A 0%, rgba(242,97,122,0) 55%),
  linear-gradient(170deg,#3A1730,#160B24 75%);}
#wall.w5{background:
  radial-gradient(110% 85% at 15% 90%, #6B5CE0 0%, rgba(107,92,224,0) 55%),
  radial-gradient(90% 70% at 90% 5%, #2B3FBF 0%, rgba(43,63,191,0) 55%),
  linear-gradient(175deg,#100B2E,#050414 80%);}
#wall.w6{background:
  radial-gradient(120% 90% at 50% 100%, #4A6572 0%, rgba(74,101,114,0) 60%),
  linear-gradient(165deg,#2B3A40,#0A1215 75%);}
#wall.custom{background:
  radial-gradient(120% 90% at 20% 10%, var(--wc1,#2BC2D6) 0%, rgba(0,0,0,0) 55%),
  linear-gradient(165deg,var(--wc2,#124A59),#08141A 78%);}
#wall::after{
  content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
  background-size:4px 4px;mix-blend-mode:overlay;pointer-events:none;
}

/* ---------- boot / lock ---------- */
#boot{position:absolute;inset:0;z-index:90;display:grid;place-items:center;
  background:linear-gradient(170deg,#08222C,#04121A);text-align:center;color:#E8F7F8}
#boot.hide{opacity:0;pointer-events:none;transition:opacity .6s ease}
.wordmark{font-family:var(--ff-disp);font-weight:800;letter-spacing:-.03em;
  font-size:clamp(2.1rem,11vw,5.2rem);line-height:.9;margin:0;display:flex;justify-content:center;flex-wrap:wrap}
.wordmark .lt{display:inline-block;
  background:linear-gradient(100deg,#7BD8E6,#1FA2B8 55%,#8FE3C8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:letterwave 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes letterwave{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-.14em)}
}
@media (prefers-reduced-motion: reduce){
  .wordmark .lt{animation:none}
}
.boot-sub{color:#87B7C0;margin:.9rem 0 0;font-size:.95rem}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
#boot .ring{width:64px;height:64px;margin:2rem auto 0;border-radius:50%;
  border:3px solid rgba(123,216,230,.25);border-top-color:#7BD8E6;animation:spin 1s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- onboarding ---------- */
#intro{position:absolute;inset:0;z-index:80;display:none;place-items:center;padding:1.2rem;
  background:rgba(4,18,24,.62);backdrop-filter:blur(18px)}
#intro.on{display:grid}
.card{width:min(440px,100%);background:var(--shell);border-radius:22px;padding:1.6rem;
  box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-family:var(--ff-disp);font-weight:700;letter-spacing:-.03em;margin:.2rem 0 .5rem;font-size:1.6rem}
.card p{color:var(--muted);margin:0 0 1.2rem;line-height:1.55;font-size:.96rem}
.steps{display:flex;gap:6px;margin-bottom:1.2rem}
.steps i{height:4px;flex:1;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.row{display:flex;gap:.6rem;align-items:center;justify-content:space-between}
.btn{padding:.62rem 1.1rem;border-radius:99px;background:var(--accent);color:#03202A;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn.quiet{background:var(--shell-2);color:var(--ink);box-shadow:none}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:38px;z-index:60;display:flex;align-items:center;
  gap:.5rem;padding:0 .7rem;background:var(--glass);backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid var(--glass-line);color:#E9F6F7;font-size:.82rem}
.tb-brand{font-family:var(--ff-disp);font-weight:700;letter-spacing:-.02em;font-size:.95rem}
.tb-spacer{flex:1}
.tb-btn{display:flex;align-items:center;gap:.35rem;padding:.25rem .5rem;border-radius:8px;color:#DCEEF1}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn[aria-expanded="true"]{background:rgba(255,255,255,.18)}
#clock{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.badge{background:var(--mango);color:#2A1300;border-radius:99px;font-size:.62rem;font-weight:700;
  padding:0 5px;min-width:15px;text-align:center;line-height:15px}
.dot-alert{width:6px;height:6px;border-radius:50%;background:var(--mango);display:none}

/* ---------- panels ---------- */
.panel{position:absolute;top:44px;z-index:70;width:min(320px,calc(100vw - 16px));
  background:var(--chrome);backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--glass-line);border-radius:20px;padding:.9rem;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.14);
  display:none;color:var(--ink)}
.panel.on{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
#control{right:8px}
#notifs{right:8px}
.panel h3{margin:.1rem 0 .7rem;font-size:.78rem;color:var(--muted);font-weight:600}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.tgl{display:flex;align-items:center;gap:.55rem;padding:.6rem .65rem;border-radius:13px;
  background:var(--shell-2);text-align:left;font-size:.84rem;font-weight:500;transition:background .15s}
.tgl .ic{width:26px;height:26px;border-radius:50%;background:var(--shell-3);display:grid;place-items:center;flex:none}
.tgl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tgl[aria-pressed="true"] .ic{background:rgba(255,255,255,.35)}
.slider{margin-top:.75rem}
.slider label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:.3rem}
input[type=range]{width:100%;accent-color:var(--accent);height:22px}
.notif{background:var(--shell-2);border-radius:13px;padding:.6rem .7rem;margin-bottom:.45rem}
.notif b{display:block;font-size:.85rem;margin-bottom:.1rem}
.notif span{font-size:.79rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:1.4rem .5rem;line-height:1.5}

/* ---------- toasts ---------- */
#toasts{position:absolute;top:46px;right:8px;z-index:75;display:flex;flex-direction:column;gap:.4rem;
  width:min(300px,calc(100vw - 16px));pointer-events:none}
.toast{background:var(--chrome);backdrop-filter:blur(20px);border:1px solid var(--glass-line);
  border-radius:14px;padding:.6rem .75rem;box-shadow:var(--shadow);animation:slidein .22s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}}
.toast b{display:block;font-size:.85rem}
.toast span{font-size:.79rem;color:var(--muted)}

/* ---------- desktop + windows ---------- */
#desktop{position:absolute;top:38px;left:0;right:0;bottom:74px;z-index:10}
.win{position:absolute;background:var(--shell);border-radius:var(--r-win);box-shadow:var(--shadow);
  border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:180px}
.win.max{inset:0 !important;width:auto !important;height:auto !important;border-radius:0}
.win.min{display:none}
.titlebar{height:38px;display:flex;align-items:center;gap:.5rem;padding:0 .55rem;flex:none;
  background:linear-gradient(180deg,var(--shell-2),var(--shell-3));border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none}
.titlebar:active{cursor:grabbing}
.tb-title{font-weight:600;font-size:.85rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lights{display:flex;gap:6px}
.light{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.light.c{background:var(--rose)} .light.m{background:var(--mango)} .light.z{background:var(--moss)}
.light:hover{filter:brightness(1.15)}
.win-body{flex:1;overflow:auto;padding:1rem;background:var(--shell)}
.grip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 50%,var(--line) 50%)}

/* ---------- dock ---------- */
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:55;
  display:flex;gap:.4rem;padding:.42rem;max-width:calc(100vw - 16px);overflow-x:auto;
  background:var(--glass);backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--glass-line);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dock-app{position:relative;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 10px -4px rgba(2,14,20,.5);
  color:#E8F7F8;transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s ease}
.dock-app:hover{transform:translateY(-6px) scale(1.04)}
.dock-app.open::after{content:"";position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 6px var(--accent-2)}
.dock-app .tip{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:rgba(6,24,30,.9);color:#E8F7F8;font-size:.72rem;padding:.2rem .5rem;border-radius:7px;
  opacity:0;pointer-events:none;transition:opacity .15s}
.dock-app:hover .tip{opacity:1}
.dock-sep{width:1px;background:rgba(255,255,255,.18);margin:.4rem .25rem;flex:none}

/* ---------- launcher ---------- */
#launcher{position:absolute;inset:0;z-index:58;display:none;padding:56px 1rem 90px;
  background:rgba(5,22,28,.6);backdrop-filter:blur(24px)}
#launcher.on{display:block}
#lsearch{width:min(420px,100%);margin:0 auto 1.4rem;display:block;padding:.7rem 1rem;border-radius:99px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#EAF7F8;outline:none}
#lsearch::placeholder{color:#9DC2C9}
#lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:1rem;
  max-width:720px;margin:0 auto;max-height:100%;overflow:auto}
.lapp{display:grid;justify-items:center;gap:.5rem;color:#E8F7F8;font-size:.78rem;padding:.5rem;border-radius:14px}
.lapp:hover{background:rgba(255,255,255,.1)}
.lapp .tile{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.16)}

/* ---------- filters ---------- */
#dim{position:absolute;inset:0;z-index:85;pointer-events:none;background:#000;opacity:0;transition:opacity .2s}
#warm{position:absolute;inset:0;z-index:84;pointer-events:none;background:#FF8A2B;opacity:0;
  mix-blend-mode:multiply;transition:opacity .3s}

/* ---------- app internals ---------- */
.app-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.score{font-family:var(--ff-disp);font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
.score small{display:block;font-family:var(--ff-ui);font-weight:500;font-size:.68rem;color:var(--muted);letter-spacing:0}
.scores{display:flex;gap:1rem}
.pill{padding:.34rem .75rem;border-radius:99px;background:var(--shell-2);font-size:.8rem;font-weight:600}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.stage{display:grid;place-items:center}
canvas{display:block;width:100%;max-width:400px;aspect-ratio:1;border-radius:14px;background:var(--shell-2);touch-action:none}
.hint{color:var(--muted);font-size:.78rem;text-align:center;margin-top:.7rem;line-height:1.5}
.dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:.35rem;
  justify-content:center;margin-top:.9rem}
.dpad button{background:var(--shell-2);border-radius:12px;font-size:1.1rem;color:var(--muted)}
.dpad button:active{background:var(--accent);color:var(--accent-ink)}
.touch .dpad{display:grid}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,24,30,.72);
  color:#EAF7F8;text-align:center;border-radius:var(--r-win);padding:1rem;z-index:5}
.over h3{font-family:var(--ff-disp);font-size:1.5rem;margin:0 0 .3rem;letter-spacing:-.02em}
.over p{margin:0 0 1rem;color:#A8CBD1;font-size:.88rem}

/* 2048 */
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--shell-3);
  padding:8px;border-radius:14px;width:100%;max-width:360px;aspect-ratio:1;touch-action:none}
.c2048{border-radius:9px;display:grid;place-items:center;font-family:var(--ff-disp);font-weight:700;
  background:var(--shell-2);font-size:clamp(.9rem,5vw,1.55rem);letter-spacing:-.03em;
  transition:transform .1s ease}
.c2048.new{animation:tilein .14s ease-out}
@keyframes tilein{from{transform:scale(.6)}}
.v2{background:#CFE6E3;color:#12363C}.v4{background:#BCDCD9;color:#12363C}
.v8{background:#7BD8E6;color:#04212A}.v16{background:#4BC3DA;color:#04212A}
.v32{background:#1FA2B8;color:#F0FEFF}.v64{background:#0E7F95;color:#F0FEFF}
.v128{background:#FFC46B;color:#3A2200}.v256{background:#FF9A3C;color:#3A2200}
.v512{background:#F2617A;color:#fff}.v1024{background:#C7447A;color:#fff}
.v2048{background:#57B894;color:#03231A}

/* minesweeper */
.mgrid{display:grid;gap:3px;background:var(--shell-3);padding:5px;border-radius:12px;touch-action:manipulation}
.mc{aspect-ratio:1;border-radius:5px;background:var(--shell-2);display:grid;place-items:center;
  font-weight:700;font-size:clamp(.6rem,2.6vw,.9rem);min-width:0;user-select:none}
.mc.rev{background:var(--shell-3);cursor:default}
.mc.boom{background:var(--rose);color:#fff}
.n1{color:#1FA2B8}.n2{color:#57B894}.n3{color:#F2617A}.n4{color:#7A3D8F}
.n5{color:#FF9A3C}.n6{color:#0E7F95}.n7{color:var(--ink)}.n8{color:var(--muted)}

/* memory */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px}
.mem{aspect-ratio:1;border-radius:12px;background:var(--accent);color:transparent;font-size:1.5rem;
  display:grid;place-items:center;transition:background .18s,color .18s,transform .18s}
.mem.up{background:var(--shell-2);color:var(--ink)}
.mem.done{background:var(--moss);color:#03231A;opacity:.7}

/* tic tac toe */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:280px}
.tc{aspect-ratio:1;border-radius:14px;background:var(--shell-2);font-family:var(--ff-disp);
  font-size:2rem;font-weight:700;display:grid;place-items:center}
.tc.x{color:var(--accent)}.tc.o{color:var(--mango)}
.tc.win{background:var(--accent);color:var(--accent-ink) !important}

/* notes + settings */
#noteArea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:.8rem;
  background:var(--shell-2);resize:vertical;line-height:1.6;outline:none}
#noteArea:focus{border-color:var(--accent)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row p{margin:.15rem 0 0;font-size:.78rem;color:var(--muted);max-width:34ch}
.set-row strong{font-size:.92rem;font-weight:600}
.seg{display:flex;background:var(--shell-2);border-radius:99px;padding:3px;flex:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.seg button{padding:.35rem .7rem;border-radius:99px;font-size:.78rem;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px -1px rgba(0,0,0,.25)}
.swatches{display:flex;gap:.5rem;flex:none;align-items:center;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s ease}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--shell),0 0 0 3px var(--ink)}
.sw-custom{position:relative;width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;
  background:conic-gradient(from 0deg,#F2617A,#FF9A3C,#57B894,#1FA2B8,#6B5CE0,#F2617A);
  border:2px solid transparent;cursor:pointer}
.sw-custom.on{border-color:var(--ink)}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;border:0;padding:0}
.wallpicks{display:flex;gap:.5rem;flex:none;flex-wrap:wrap;max-width:230px;justify-content:flex-end}
.wp{width:46px;height:32px;border-radius:9px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .12s ease}
.wp:hover{transform:scale(1.06)}
.wp.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--shell),0 0 0 3px var(--accent)}
.wp1{background:linear-gradient(140deg,#2BC2D6,#07202A)}

</style>
</head>
<body>
<div id="screen">
  <div id="wall" class="w1"></div>

  <!-- top bar -->
  <div id="topbar">
    <span class="tb-brand">Dawson</span>
    <span class="tb-spacer"></span>
    <button class="tb-btn" id="btnNotifs" aria-expanded="false" aria-label="Notifications">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" id="nBadge" style="display:none">0</span>
    </button>
    <button class="tb-btn" id="btnControl" aria-expanded="false" aria-label="Control center">
      <svg id="icWifi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="16" height="9" rx="2.5"/><path d="M21 11v3"/><rect x="4" y="10" width="11" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
    </button>

  <!-- control center -->
  <div class="panel" id="control" role="dialog" aria-label="Control center">
    <h3>Controls</h3>
    <div class="toggles">
      <button class="tgl" data-tgl="wifi" aria-pressed="true"><span class="ic">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg></span>Wi-Fi</button>
      <button class="tgl" data-tgl="dnd" aria-pressed="false"><span class="ic">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></span>Do Not Disturb</button>
      <button class="tgl" data-tgl="air" aria-pressed="false"><span class="ic">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l1.5 6.5L21 12l-7.5 2.5L12 21l-1.5-6.5L3 12l7.5-2.5z"/></svg></span>Airplane</button>
      <button class="tgl" data-tgl="night" aria-pressed="false"><span class="ic">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></span>Night light</button>
    </div>
    <div class="slider">
      <label for="bright">Brightness <span id="brightV">100%</span></label>
      <input type="range" id="bright" min="25" max="100" value="100">
    </div>
    <div class="slider">
      <label for="vol">Volume <span id="volV">60%</span></label>
      <input type="range" id="vol" min="0" max="100" value="60">
    </div>
  </div>

  <!-- notifications -->
  <div class="panel" id="notifs" role="dialog" aria-label="Notifications">
    <div class="row" style="margin-bottom:.6rem">
      <h3 style="margin:0">Notifications</h3>
      <button class="btn ghost" id="clearAll" style="padding:.2rem .5rem;font-size:.78rem">Clear all</button>

  <div id="toasts"></div>

  <!-- launcher -->
  <div id="launcher">
    <input id="lsearch" type="search" placeholder="Search apps" aria-label="Search apps">

  <div id="dock"></div>
  <div id="warm"></div>

  <!-- onboarding -->
  <div id="intro">
    <div class="card">
      <div class="steps"><i class="on"></i><i></i><i></i></div>
      <h2 id="introTitle">Welcome to Dawson</h2>
      <p id="introBody">A small desktop that lives in your browser. Open a few windows, move them around, play something.</p>

        <button class="btn ghost" id="introSkip">Skip</button>

  <!-- boot -->

    <div>
      <h1 class="wordmark" id="wordmark" aria-label="DAWSON"></h1>

</div>

<script>
/* ============ tiny helpers ============ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;};
const store = {
  get(k,d){ try{ const v=localStorage.getItem('dawson:'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('dawson:'+k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('dawson:'+k); }catch(e){} }
};
const isTouch = matchMedia('(hover: none)').matches;
const small = ()=>innerWidth < 760;

/* ============ sound ============ */
let actx=null, volume=store.get('vol',60);
function beep(freq=520,dur=.06,type='sine',gain=.05){
  if(volume<=0) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=gain*(volume/100);
    o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}

/* ============ icons ============ */
const I = {
  grid:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  snake:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8v6H8v6h10"/><circle cx="19" cy="6" r="1.6" fill="currentColor"/></svg>',
  n2048:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18" opacity=".55"/></svg>',
  mine:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
  mem:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="10" height="14" rx="2.5"/><rect x="11" y="7" width="10" height="14" rx="2.5" fill="currentColor" fill-opacity=".22"/></svg>',
  tic:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/><path d="M4.5 4.5l3 3M7.5 4.5l-3 3" stroke-width="2.4"/><circle cx="18.5" cy="18.5" r="2" stroke-width="2.4"/></svg>',
  note:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  set:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>',
  info:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor"/></svg>',
  cloud:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.4-7.98A5.5 5.5 0 0 1 17.3 9.3 3.9 3.9 0 0 1 17.5 18z"/><path d="M10.6 11.6l4 2.2-4 2.2z" fill="currentColor" stroke-width="1.4"/></svg>',
  find:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/></svg>'
};

/* ============ system state ============ */
const sys = {
  wifi: store.get('wifi',true),
  dnd: store.get('dnd',false),
  air: store.get('air',false),
  night: store.get('night',false),
  bright: store.get('bright',100),
  wall: store.get('wall','w1'),
  wc1: store.get('wc1','#2BC2D6'),
  wc2: store.get('wc2','#124A59'),
  theme: store.get('theme','dark'),
  accent: store.get('accent','#1FA2B8')
};
const notifications = [];

function applySystem(){
  $('#wall').className = sys.wall;
  document.documentElement.setAttribute('data-theme', sys.theme === 'auto' ? '' : sys.theme);
  if(sys.theme==='auto') document.documentElement.removeAttribute('data-theme');
  document.documentElement.style.setProperty('--accent', sys.accent);
  document.documentElement.style.setProperty('--accent-2', mix(sys.accent,'#ffffff',.35));
  document.documentElement.style.setProperty('--accent-ink', readableInk(sys.accent));
  document.documentElement.style.setProperty('--wc1', sys.wc1);
  document.documentElement.style.setProperty('--wc2', sys.wc2);
  $('#dim').style.opacity = String((100 - sys.bright)/170);
  $('#warm').style.opacity = sys.night ? '.22' : '0';
  $('#icWifi').style.opacity = (sys.wifi && !sys.air) ? '1' : '.35';
  $$('.tgl').forEach(b=>b.setAttribute('aria-pressed', String(!!sys[b.dataset.tgl])));
  $('#bright').value = sys.bright; $('#brightV').textContent = sys.bright+'%';
  $('#vol').value = volume; $('#volV').textContent = volume+'%';
  ['wifi','dnd','air','night','bright','wall','wc1','wc2','theme','accent'].forEach(k=>store.set(k,sys[k]));
  store.set('vol',volume);
}
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function mix(hexA,hexB,t){ const a=hexToRgb(hexA), b=hexToRgb(hexB);
  return rgbToHex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t); }
function readableInk(hex){ const [r,g,b]=hexToRgb(hex);
  const lum = (.299*r+.587*g+.114*b)/255;
  return lum > .62 ? '#0A2026' : '#F3FBFB'; }

function notify(title, body){
  notifications.unshift({title,body,t:Date.now()});
  renderNotifs();
  if(sys.dnd) return;
  const t = el('div','toast',`<b></b><span></span>`);
  t.querySelector('b').textContent = title;
  t.querySelector('span').textContent = body;
  $('#toasts').append(t);
  beep(660,.05,'triangle',.035);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translateX(16px)';
    setTimeout(()=>t.remove(),320); }, 3600);
}
function renderNotifs(){
  const list = $('#nList'); list.innerHTML='';
  if(!notifications.length){ list.append(el('div','empty','Nothing here yet.<br>System messages will show up in this tray.')); }
  notifications.slice(0,20).forEach(n=>{
    const d = el('div','notif','<b></b><span></span>');
    d.querySelector('b').textContent = n.title;
    d.querySelector('span').textContent = n.body;
    list.append(d);
  });
  const b = $('#nBadge');
  b.style.display = notifications.length ? '' : 'none';
  b.textContent = notifications.length;
}

/* ============ window manager ============ */
let zTop = 10;
const openWindows = new Map();

function openApp(id){
  const app = APPS.find(a=>a.id===id);
  if(!app) return;
  if(app.action){ app.action(); return; }
  if(openWindows.has(id)){
    const w = openWindows.get(id);
    w.classList.remove('min'); w.style.zIndex = ++zTop; return;
  }
  const w = el('div','win');
  w.innerHTML = `
    <div class="titlebar">
      <div class="lights">
        <button class="light c" aria-label="Close ${app.name}"></button>
        <button class="light m" aria-label="Minimize ${app.name}"></button>
        <button class="light z" aria-label="Maximize ${app.name}"></button>
      </div>
      <div class="tb-title"></div>
    </div>
    <div class="win-body"></div>
    <div class="grip" aria-hidden="true"></div>`;
  w.querySelector('.tb-title').textContent = app.name;
  const body = w.querySelector('.win-body');

  const dw = Math.min(app.w||460, innerWidth-24);
  const dh = Math.min(app.h||480, innerHeight-150);
  w.style.width = dw+'px'; w.style.height = dh+'px';
  const n = openWindows.size;
  w.style.left = Math.max(8, (innerWidth-dw)/2 + n*22 - 40)+'px';
  w.style.top = Math.max(8, 30 + n*20)+'px';
  w.style.zIndex = ++zTop;
  if(small()) w.classList.add('max');
  if(isTouch) w.classList.add('touch');

  $('#desktop').append(w);
  openWindows.set(id,w);
  const api = { close:()=>closeApp(id), notify, beep, win:w };
  app.mount(body, api);

  w.addEventListener('pointerdown', ()=>{ w.style.zIndex = ++zTop; }, true);
  w.querySelector('.light.c').onclick = e=>{ e.stopPropagation(); closeApp(id); };
  w.querySelector('.light.m').onclick = e=>{ e.stopPropagation(); w.classList.add('min'); renderDock(); };
  w.querySelector('.light.z').onclick = e=>{ e.stopPropagation(); w.classList.toggle('max'); };
  w.querySelector('.titlebar').addEventListener('dblclick', ()=>w.classList.toggle('max'));
  makeDraggable(w);
  makeResizable(w);
  renderDock();
  beep(420,.05,'sine',.03);
}
function closeApp(id){
  const w = openWindows.get(id);
  if(!w) return;
  if(w._cleanup) w._cleanup();
  w.remove(); openWindows.delete(id); renderDock();
}
function isActive(w){
  if(!w || w.classList.contains('min')) return false;
  let top = null, z = -1;
  openWindows.forEach(x=>{ if(!x.classList.contains('min') && +x.style.zIndex > z){ z=+x.style.zIndex; top=x; } });
  return top === w;
}
function makeDraggable(w){
  const bar = w.querySelector('.titlebar');
  let sx,sy,ox,oy,on=false;
  bar.addEventListener('pointerdown', e=>{
    if(e.target.closest('.light')) return;
    if(w.classList.contains('max')) return;
    on=true; sx=e.clientX; sy=e.clientY; ox=w.offsetLeft; oy=w.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e=>{
    if(!on) return;
    const maxX = $('#desktop').clientWidth - 60, maxY = $('#desktop').clientHeight - 40;
    w.style.left = Math.min(maxX, Math.max(-w.offsetWidth+80, ox + e.clientX - sx))+'px';
    w.style.top  = Math.min(maxY, Math.max(0, oy + e.clientY - sy))+'px';
  });
  bar.addEventListener('pointerup', e=>{ on=false; try{bar.releasePointerCapture(e.pointerId);}catch(_){} });
}
function makeResizable(w){
  const g = w.querySelector('.grip');
  let sx,sy,ow,oh,on=false;
  g.addEventListener('pointerdown', e=>{
    on=true; sx=e.clientX; sy=e.clientY; ow=w.offsetWidth; oh=w.offsetHeight;
    g.setPointerCapture(e.pointerId); e.stopPropagation();
  });
  g.addEventListener('pointermove', e=>{
    if(!on) return;
    w.style.width = Math.max(260, ow + e.clientX - sx)+'px';
    w.style.height = Math.max(180, oh + e.clientY - sy)+'px';
  });
  g.addEventListener('pointerup', e=>{ on=false; try{g.releasePointerCapture(e.pointerId);}catch(_){} });
}

/* ============ dock + launcher ============ */
function renderDock(){
  const dock = $('#dock'); dock.innerHTML='';
  const mk = (app)=>{
    const b = el('button','dock-app', app.icon + `<span class="tip"></span>`);
    b.querySelector('.tip').textContent = app.name;
    b.setAttribute('aria-label', app.name);
    if(openWindows.has(app.id)) b.classList.add('open');
    b.onclick = ()=>{
      const w = openWindows.get(app.id);
      if(w && !w.classList.contains('min') && w.style.zIndex == zTop){ w.classList.add('min'); renderDock(); }
      else openApp(app.id);
    };
    return b;
  };
  dock.append(mk(APPS[0]));
  dock.append(el('div','dock-sep'));
  APPS.filter(a=>a.dock).forEach(a=>dock.append(mk(a)));
}
function renderLauncher(filter=''){
  const g = $('#lgrid'); g.innerHTML='';
  APPS.filter(a=>!a.action && a.name.toLowerCase().includes(filter.toLowerCase())).forEach(a=>{
    const b = el('button','lapp',`<span class="tile">${a.icon}</span><span></span>`);
    b.querySelector('span:last-child').textContent = a.name;
    b.onclick = ()=>{ toggleLauncher(false); openApp(a.id); };
    g.append(b);
  });
  if(!g.children.length) g.append(el('div','empty','No app by that name. Try "snake" or "notes".'));
}
function toggleLauncher(force){
  const l = $('#launcher');
  const on = force==null ? !l.classList.contains('on') : force;
  l.classList.toggle('on', on);
  if(on){ renderLauncher(''); $('#lsearch').value=''; if(!isTouch) setTimeout(()=>$('#lsearch').focus(),40); }
}

/* ============ apps ============ */
function head(body, left, right){
  const h = el('div','app-head');
  h.append(left); if(right) h.append(right);
  body.append(h); return h;
}
function scoreBlock(label, val){
  const s = el('div','score'); s.innerHTML = `<span></span><small></small>`;
  s.querySelector('span').textContent = val; s.querySelector('small').textContent = label;
  return s;
}

/* ---- Snake ---- */
function mountSnake(body, api){
  body.style.position='relative';
  const best0 = store.get('snakeBest',0);
  const sc = scoreBlock('Score','0'), bs = scoreBlock('Best',String(best0));
  const scores = el('div','scores'); scores.append(sc,bs);
  const again = el('button','pill','Restart');
  head(body, scores, again);
  const stage = el('div','stage');
  const cv = el('canvas'); cv.width=400; cv.height=400;
  stage.append(cv); body.append(stage);
  const dpad = el('div','dpad',`<button data-d="0"></button><button data-d="1">↑</button><button data-d="2"></button>
    <button data-d="3">←</button><button data-d="4">↓</button><button data-d="5">→</button>`);
  body.append(dpad);
  body.append(el('div','hint','Arrow keys or WASD to steer. Swipe works too.'));

  const ctx = cv.getContext('2d');
  const N = 20, S = 400/N;
  let snake, dir, nextDir, food, score, alive, timer, tick;

  function reset(){
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; nextDir = dir; score=0; alive=true; tick=125;
    placeFood(); sc.querySelector('span').textContent='0';
    clearInterval(timer); timer = setInterval(step, tick);
    draw();
  }
  function placeFood(){
    do{ food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function step(){
    if(!alive) return;
    dir = nextDir;
    const h = {x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};
    if(snake.some(s=>s.x===h.x&&s.y===h.y)){ die(); return; }
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){
      score+=10; sc.querySelector('span').textContent=String(score);
      placeFood(); beep(880,.05,'square',.04);
      if(score%50===0 && tick>60){ tick-=8; clearInterval(timer); timer=setInterval(step,tick); }
    } else snake.pop();
    draw();
  }
  function die(){
    alive=false; clearInterval(timer); beep(160,.25,'sawtooth',.05);
    const best = store.get('snakeBest',0);
    if(score>best){ store.set('snakeBest',score); bs.querySelector('span').textContent=String(score);
      api.notify('Snake','New best score: '+score); }
    const o = el('div','over',`<div><h3>Game over</h3><p></p><button class="btn">Play again</button></div>`);
    o.querySelector('p').textContent = 'You scored '+score+'.';
    o.querySelector('button').onclick = ()=>{ o.remove(); reset(); };
    body.append(o);
  }
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function draw(){
    ctx.clearRect(0,0,400,400);
    ctx.fillStyle = css('--shell-2') || '#123'; ctx.fillRect(0,0,400,400);
    ctx.fillStyle = css('--mango');
    ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S*.34, 0, 7); ctx.fill();
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? css('--accent-2') : css('--accent');
      const p = i===0?1:2.5;
      ctx.beginPath();
      ctx.roundRect(s.x*S+p, s.y*S+p, S-p*2, S-p*2, 4); ctx.fill();
    });
  }
  const keys = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
                w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
  function turn(x,y){ if(dir.x===-x&&dir.y===-y) return; nextDir={x,y}; }
  function onKey(e){
    if(!isActive(api.win)) return;
    const k = keys[e.key]; if(!k) return;
    e.preventDefault(); turn(k[0],k[1]);
  }
  addEventListener('keydown', onKey);
  dpad.onclick = e=>{ const b=e.target.closest('button'); if(!b) return;
    const m={1:[0,-1],3:[-1,0],4:[0,1],5:[1,0]}[b.dataset.d]; if(m) turn(m[0],m[1]); };
  let tx,ty;
  cv.addEventListener('pointerdown', e=>{tx=e.clientX;ty=e.clientY});
  cv.addEventListener('pointerup', e=>{
    const dx=e.clientX-tx, dy=e.clientY-ty;
    if(Math.hypot(dx,dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
  });
  again.onclick = ()=>{ $$('.over',body).forEach(o=>o.remove()); reset(); };
  api.win._cleanup = ()=>{ clearInterval(timer); removeEventListener('keydown', onKey); };
  reset();
}

/* ---- 2048 ---- */
function mount2048(body, api){
  body.style.position='relative';
  const sc = scoreBlock('Score','0'), bs = scoreBlock('Best',String(store.get('bestx',0)));
  const scores = el('div','scores'); scores.append(sc,bs);
  const again = el('button','pill','New game');
  head(body, scores, again);
  const stage = el('div','stage');
  const grid = el('div','g2048'); stage.append(grid); body.append(stage);
  body.append(el('div','hint','Arrow keys or swipe. Join equal tiles to reach 2048.'));
  const cells = [];
  for(let i=0;i<16;i++){ const c=el('div','c2048'); grid.append(c); cells.push(c); }
  let b, score, won;

  function reset(){ b = Array(16).fill(0); score=0; won=false; add(); add(); paint(); }
  function add(){
    const free = b.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(!free.length) return;
    const i = free[(Math.random()*free.length)|0];
    b[i] = Math.random()<.9?2:4;
    cells[i].classList.add('new'); setTimeout(()=>cells[i].classList.remove('new'),160);
  }
  function paint(){
    b.forEach((v,i)=>{ const c=cells[i];
      c.textContent = v||''; c.className='c2048'+(v?' v'+Math.min(v,2048):'');
    });
    sc.querySelector('span').textContent = String(score);
    const best = store.get('bestx',0);
    if(score>best){ store.set('bestx',score); bs.querySelector('span').textContent=String(score); }
  }
  function slide(row){
    let r = row.filter(v=>v), out=[];
    for(let i=0;i<r.length;i++){
      if(r[i]===r[i+1]){ out.push(r[i]*2); score+=r[i]*2; i++; }
      else out.push(r[i]);
    }
    while(out.length<4) out.push(0);
    return out;
  }
  function move(dir){
    const before = b.join(',');
    for(let i=0;i<4;i++){
      let idx = [0,1,2,3].map(j=> dir==='l'||dir==='r' ? i*4+j : j*4+i);
      if(dir==='r'||dir==='d') idx.reverse();
      const vals = slide(idx.map(k=>b[k]));
      idx.forEach((k,j)=>b[k]=vals[j]);
    }
    if(b.join(',')===before) return;
    add(); paint(); beep(300+Math.random()*60,.04,'sine',.025);
    if(!won && b.includes(2048)){ won=true; api.notify('2048','You reached 2048.'); over('You win','Keep going or start fresh.'); }
    else if(dead()) over('No moves left','Final score: '+score);
  }
  function dead(){
    if(b.includes(0)) return false;
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const v=b[r*4+c];
      if(c<3 && v===b[r*4+c+1]) return false;
      if(r<3 && v===b[(r+1)*4+c]) return false;
    }
    return true;
  }
  function over(t,p){
    const o = el('div','over',`<div><h3></h3><p></p><button class="btn">New game</button></div>`);
    o.querySelector('h3').textContent=t; o.querySelector('p').textContent=p;
    o.querySelector('button').onclick=()=>{o.remove();reset();};
    body.append(o);
  }
  const map={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'};
  function onKey(e){ if(!isActive(api.win)) return; const m=map[e.key]; if(!m) return; e.preventDefault(); move(m); }
  addEventListener('keydown', onKey);
  let tx,ty;
  grid.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY});
  grid.addEventListener('pointerup',e=>{
    const dx=e.clientX-tx,dy=e.clientY-ty;
    if(Math.hypot(dx,dy)<24) return;
    move(Math.abs(dx)>Math.abs(dy) ? (dx>0?'r':'l') : (dy>0?'d':'u'));
  });
  again.onclick=()=>{ $$('.over',body).forEach(o=>o.remove()); reset(); };
  api.win._cleanup = ()=> removeEventListener('keydown', onKey);
  reset();
}

/* ---- Minesweeper ---- */
function mountMines(body, api){
  body.style.position='relative';
  const R=9,C=9,M=10;
  const left = scoreBlock('Mines left', String(M));
  const flagBtn = el('button','pill','Flag mode');
  const again = el('button','pill','New board');
  const tools = el('div','scores'); tools.append(flagBtn, again);
  head(body, left, tools);
  const stage = el('div','stage');
  const grid = el('div','mgrid');
  grid.style.gridTemplateColumns = `repeat(${C},1fr)`;
  grid.style.width='100%'; grid.style.maxWidth='360px';
  stage.append(grid); body.append(stage);
  body.append(el('div','hint','Reveal every safe square. Right-click (or use flag mode) to mark a mine.'));

  let mines, rev, flags, done, first;
  function reset(){
    mines=Array(R*C).fill(false); rev=Array(R*C).fill(false); flags=Array(R*C).fill(false);
    done=false; first=true; left.querySelector('span').textContent=String(M);
    grid.innerHTML='';
    for(let i=0;i<R*C;i++){
      const c = el('button','mc'); c.dataset.i=i;
      c.oncontextmenu = e=>{e.preventDefault(); flag(i);};
      c.onclick = ()=> flagBtn.classList.contains('on') ? flag(i) : reveal(i);
      grid.append(c);
    }
  }
  function seed(safe){
    let placed=0;
    const around = neighbors(safe).concat([safe]);
    while(placed<M){
      const i=(Math.random()*R*C)|0;
      if(mines[i]||around.includes(i)) continue;
      mines[i]=true; placed++;
    }
  }
  function neighbors(i){
    const r=(i/C)|0, c=i%C, out=[];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc) continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<R&&nc>=0&&nc<C) out.push(nr*C+nc);
    }
    return out;
  }
  function count(i){ return neighbors(i).filter(n=>mines[n]).length; }
  function flag(i){
    if(done||rev[i]) return;
    flags[i]=!flags[i];
    const c=grid.children[i];
    c.textContent = flags[i]?'⚑':'';
    c.style.color = flags[i]?'var(--mango)':'';
    left.querySelector('span').textContent = String(M - flags.filter(Boolean).length);
    beep(440,.04,'square',.03);
  }
  function reveal(i){
    if(done||rev[i]||flags[i]) return;
    if(first){ seed(i); first=false; }
    if(mines[i]) return boom(i);
    const stack=[i];
    while(stack.length){
      const k=stack.pop();
      if(rev[k]||flags[k]) continue;
      rev[k]=true;
      const c=grid.children[k], n=count(k);
      c.classList.add('rev');
      if(n){ c.textContent=n; c.classList.add('n'+n); }
      else neighbors(k).forEach(x=>{ if(!rev[x]) stack.push(x); });
    }
    beep(520,.04,'sine',.025);
    if(rev.filter(Boolean).length === R*C-M) win();
  }
  function boom(i){
    done=true;
    mines.forEach((m,k)=>{ if(m){ const c=grid.children[k]; c.classList.add('rev'); c.textContent='●'; } });
    grid.children[i].classList.add('boom');
    beep(140,.3,'sawtooth',.05);
    over('Mine hit','That square was loaded.');
  }
  function win(){
    done=true; beep(720,.12,'triangle',.05);
    api.notify('Minesweeper','Board cleared.');
    over('Board cleared','Every safe square found.');
  }
  function over(t,p){
    const o=el('div','over',`<div><h3></h3><p></p><button class="btn">New board</button></div>`);
    o.querySelector('h3').textContent=t; o.querySelector('p').textContent=p;
    o.querySelector('button').onclick=()=>{o.remove();reset();};
    body.append(o);
  }
  flagBtn.onclick = ()=> flagBtn.classList.toggle('on');
  again.onclick = ()=>{ $$('.over',body).forEach(o=>o.remove()); reset(); };
  reset();
}

function mountMemory(body, api){
  body.style.position='relative';
  const moves = scoreBlock('Moves','0');
  const again = el('button','pill','Shuffle');
  head(body, moves, again);
  const stage = el('div','stage');
  const grid = el('div','memgrid'); stage.append(grid); body.append(stage);
  body.append(el('div','hint','Find all eight pairs. Tap two cards to compare them.'));
  const faces = ['▲','●','■','◆','★','✚','♦','⬟'];
  let deck, open, lock, count, matched;
  function reset(){
    deck = faces.concat(faces).sort(()=>Math.random()-.5);
    open=[]; lock=false; count=0; matched=0;
    moves.querySelector('span').textContent='0';
    grid.innerHTML='';
    deck.forEach((f,i)=>{
      const c = el('button','mem'); c.textContent=f; c.dataset.i=i;
      c.setAttribute('aria-label','Card '+(i+1));
      c.onclick = ()=>flip(i,c);
      grid.append(c);
    });
  }
  function flip(i,c){
    if(lock||c.classList.contains('up')||c.classList.contains('done')) return;
    c.classList.add('up'); open.push({i,c}); beep(600,.04,'sine',.03);
    if(open.length===2){
      count++; moves.querySelector('span').textContent=String(count);
      const [a,b]=open;
      if(deck[a.i]===deck[b.i]){
        a.c.classList.add('done'); b.c.classList.add('done');
        open=[]; matched++; beep(820,.07,'triangle',.04);
        if(matched===8){
          api.notify('Memory','Cleared in '+count+' moves.');
          const o=el('div','over',`<div><h3>All matched</h3><p></p><button class="btn">Shuffle</button></div>`);
          o.querySelector('p').textContent='Finished in '+count+' moves.';
          o.querySelector('button').onclick=()=>{o.remove();reset();};
          body.append(o);
        }
      } else {
        lock=true;
        setTimeout(()=>{ a.c.classList.remove('up'); b.c.classList.remove('up'); open=[]; lock=false; }, 650);
      }
    }
  }
  again.onclick=()=>{ $$('.over',body).forEach(o=>o.remove()); reset(); };
  reset();
}

/* ---- Tic tac toe ---- */
function mountTic(body, api){
  const rec = store.get('tic',{w:0,l:0,d:0});
  const sc = scoreBlock('Record', `${rec.w}W · ${rec.l}L · ${rec.d}D`);
  const again = el('button','pill','New round');
  head(body, sc, again);
  const status = el('div','hint','You play ✕. Your move.');
  status.style.margin='0 0 .8rem';
  body.append(status);
  const stage = el('div','stage');
  const grid = el('div','tgrid'); stage.append(grid); body.append(stage);
  let b, over;
  const WIN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function reset(){
    b=Array(9).fill(''); over=false; grid.innerHTML='';
    status.textContent='You play ✕. Your move.';
    for(let i=0;i<9;i++){
      const c=el('button','tc'); c.dataset.i=i;
      c.setAttribute('aria-label','Square '+(i+1));
      c.onclick=()=>play(i); grid.append(c);
    }
  }
  function paint(){ b.forEach((v,i)=>{ const c=grid.children[i]; c.textContent=v; c.className='tc'+(v?' '+v.toLowerCase():''); }); }
  function winner(bd){
    for(const w of WIN){ const [a,x,y]=w; if(bd[a]&&bd[a]===bd[x]&&bd[a]===bd[y]) return {p:bd[a],line:w}; }
    return bd.includes('')?null:{p:'D',line:[]};
  }
  function play(i){
    if(over||b[i]) return;
    b[i]='✕'; paint(); beep(520,.05,'sine',.03);
    if(check()) return;
    const m = Math.random()<.2 ? randomMove() : best('◯').i;
    if(m!=null){ b[m]='◯'; paint(); beep(380,.05,'sine',.03); }
    check();
  }
  function randomMove(){ const f=b.map((v,i)=>v?null:i).filter(v=>v!==null); return f[(Math.random()*f.length)|0]; }
  function best(p){
    const opp = p==='◯'?'✕':'◯';
    const w = winner(b);
    if(w){ return {s: w.p==='D'?0:(w.p==='◯'?1:-1), i:null}; }
    let bi=null, bs = p==='◯'?-2:2;
    b.forEach((v,i)=>{
      if(v) return;
      b[i]=p; const r=best(opp).s; b[i]='';
      if(p==='◯' ? r>bs : r<bs){ bs=r; bi=i; }
    });
    return {s:bs,i:bi};
  }
  function check(){
    const w = winner(b);
    if(!w) return false;
    over=true;
    const r = store.get('tic',{w:0,l:0,d:0});
    if(w.p==='✕'){ status.textContent='You win.'; r.w++; }
    else if(w.p==='◯'){ status.textContent='Dawson wins this one.'; r.l++; }
    else { status.textContent='Draw.'; r.d++; }
    w.line.forEach(i=>grid.children[i].classList.add('win'));
    store.set('tic',r);
    sc.querySelector('span').textContent = `${r.w}W · ${r.l}L · ${r.d}D`;
    return true;
  }
  again.onclick=reset;
  reset();
}

  q.type = 'search'; q.placeholder = 'Search the web';
  q.setAttribute('aria-label','Search query');
  q.style.cssText = 'flex:1;min-width:0;padding:.6rem .9rem;border-radius:99px;border:1px solid var(--line);background:var(--shell-2);outline:none';
  q.onfocus = ()=>q.style.borderColor='var(--accent)';
  q.onblur  = ()=>q.style.borderColor='var(--line)';
  const go = el('button','btn','Search');
  const run = ()=>{
    const v = q.value.trim();
    if(!v) { q.focus(); return; }
    beep(700,.06,'triangle',.04);
    window.open('https://duckduckgo.com/?q=' + encodeURIComponent(v), '_blank', 'noopener');
  };
  go.onclick = run;
  q.addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  wrap.append(q, go);
  d.append(wrap);
  const note = el('p',null,'Results open in a new tab, the same as searching from your address bar.');
  note.style.cssText = 'font-size:.8rem;color:var(--muted);margin:.3rem 0 0;line-height:1.55';
  d.append(note);
  body.append(d);
  setTimeout(()=>{ if(!isTouch) q.focus(); }, 60);
}

/* ============ shell wiring ============ */
function closePanels(except){
  ['control','notifs'].forEach(id=>{
    if(id!==except){ $('#'+id).classList.remove('on'); }
  });
  $('#btnControl').setAttribute('aria-expanded', String(except==='control'));
  $('#btnNotifs').setAttribute('aria-expanded', String(except==='notifs'));
}
$('#btnControl').onclick = e=>{ e.stopPropagation();
  const on = !$('#control').classList.contains('on');
  closePanels(on?'control':null); $('#control').classList.toggle('on',on); };
$('#btnNotifs').onclick = e=>{ e.stopPropagation();
  const on = !$('#notifs').classList.contains('on');
  closePanels(on?'notifs':null); $('#notifs').classList.toggle('on',on); };
document.addEventListener('pointerdown', e=>{
  if(!e.target.closest('.panel') && !e.target.closest('#topbar')) closePanels(null);
});
$('#clearAll').onclick = ()=>{ notifications.length=0; renderNotifs(); };

$$('.tgl').forEach(b=>{
  b.onclick = ()=>{
    const k = b.dataset.tgl;
    sys[k] = !sys[k];
    if(k==='air' && sys.air) sys.wifi=false;
    if(k==='wifi' && sys.wifi) sys.air=false;
    applySystem(); beep(sys[k]?620:380,.05,'sine',.03);
    if(k==='dnd') notify('Do Not Disturb', sys.dnd?'Alerts go to the tray only.':'Alerts are showing again.');
  };
});
$('#bright').oninput = e=>{ sys.bright = +e.target.value; applySystem(); };
$('#vol').oninput = e=>{ volume = +e.target.value; $('#volV').textContent = volume+'%'; store.set('vol',volume); };

$('#lsearch').oninput = e=> renderLauncher(e.target.value);
$('#launcher').addEventListener('pointerdown', e=>{ if(e.target.id==='launcher') toggleLauncher(false); });
addEventListener('keydown', e=>{
  if(e.key==='Escape'){ toggleLauncher(false); closePanels(null); }
});

/* clock */
function tickClock(){
  $('#clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock, 1000); tickClock();

/* boot + onboarding */
const introSteps = [
  ['Welcome to Dawson','A small desktop that lives in your browser. Open a few windows, move them around, play something.'],
  ['The dock runs the place','Tap an icon to open an app. Tap the grid on the left to see everything installed.'],
  ['Make it yours','Pull down the control centre for Wi-Fi, Do Not Disturb, and night light. Settings has themes and wallpapers.']
];
let step = 0;
function showStep(){
  const [t,bdy] = introSteps[step];
  $('#introTitle').textContent = t; $('#introBody').textContent = bdy;
  $$('#intro .steps i').forEach((d,i)=>d.classList.toggle('on', i<=step));
  $('#introNext').textContent = step === introSteps.length-1 ? 'Enter desktop' : 'Next';
}
function finishIntro(){
  $('#intro').classList.remove('on');
  store.set('seen',true);
  setTimeout(()=>{
    notify('Dawson OS','Signed in. Everything runs locally in this tab.');
  }, 700);
}
$('#introNext').onclick = ()=>{ beep(600,.05,'sine',.03);
  if(step < introSteps.length-1){ step++; showStep(); } else finishIntro(); };
$('#introSkip').onclick = finishIntro;

$('#boot').addEventListener('click', ()=>{
  const ring = $('#boot .ring');
  ring.style.display='block';
  $('#boot .boot-sub').textContent = 'Starting up';
  $('#boot .boot-sub').classList.remove('blink');
  beep(440,.12,'triangle',.04);
  setTimeout(()=>{
    $('#boot').classList.add('hide');
    setTimeout(()=>$('#boot').remove(), 600);
    if(store.get('seen',false)){
      setTimeout(()=>notify('Dawson OS','Welcome back.'),500);
    } else {
      step=0; showStep(); $('#intro').classList.add('on');
    }
  }, 900);
}, {once:true});

/* wordmark letters */
(function(){
  const word = 'DawsonOS';
  const mount = $('#wordmark');
  [...word].forEach((ch,i)=>{
    const s = el('span','lt', ch);
    s.style.setProperty('--d', (i*0.09)+'s');
    mount.append(s);
  });
})();

/* go */
applySystem();
renderDock();
renderNotifs();
